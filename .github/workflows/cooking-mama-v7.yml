name: Cooking Mama v7 - Build Shortcut and Precision Camera APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cooking-mama-v7.yml
      - MelonMix-KH-Lock-On-touch-v1.patch
      - MelonMix-KH-Camera-Stick-v2.patch
      - MelonMix-KH-Relative-Camera-v3.patch
      - MelonMix-KH-Shortcut-Toggle-v4.patch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Collect the full source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: zulu
          cache: gradle

      - name: Add the KH Lock On touchscreen button
        run: git apply MelonMix-KH-Lock-On-touch-v1.patch

      - name: Add the KH camera touchscreen stick
        run: git apply MelonMix-KH-Camera-Stick-v2.patch

      - name: Upgrade the stick to relative precision control
        run: git apply MelonMix-KH-Relative-Camera-v3.patch

      - name: Add the tap-to-hold shortcut button
        run: git apply MelonMix-KH-Shortcut-Toggle-v4.patch

      - name: Give this complete test its own app identity
        run: sed -i 's/applicationIdSuffix = ".dev"/applicationIdSuffix = ".shortcut"/' app/build.gradle.kts

      - name: Bake the shortcut and precision-camera APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGitHubProdDebug --stacktrace

      - name: Package the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MelonMix-KH-Touch-v4-Shortcut-and-Camera
          path: app/build/outputs/apk/gitHubProd/debug/*.apk
          if-no-files-found: error
          retention-days: 7
