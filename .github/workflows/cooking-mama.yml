name: Cooking Mama - Build Lock On APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cooking-mama.yml
      - MelonMix-KH-Lock-On-touch-v1.patch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Collect the full source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android tools
        uses: android-actions/setup-android@v3

      - name: Install the matching SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Add the KH Lock On touchscreen button
        run: git apply MelonMix-KH-Lock-On-touch-v1.patch

      - name: Bake the debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGitHubProdDebug --stacktrace

      - name: Package the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MelonMix-KH-Lock-On-v1
          path: app/build/outputs/apk/gitHubProd/debug/*.apk
          if-no-files-found: error
          retention-days: 7
