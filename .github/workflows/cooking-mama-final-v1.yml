name: KHDS Touch Remix 1.0.6 - Projection Safety Hotfix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cooking-mama-final-v1.yml
      - MelonMix-KH-Lock-On-touch-v1.patch
      - MelonMix-KH-Camera-Stick-v2.patch
      - MelonMix-KH-Relative-Camera-v3.patch
      - MelonMix-KH-Shortcut-Toggle-v4.patch
      - MelonMix-KH-Movement-and-Heart-v5.patch
      - MelonMix-Layout-Grid-Snap-v6.patch
      - MelonMix-KH-Action-Buttons-v7.patch
      - MelonMix-KH-Fold-Experience-v8.patch
      - MelonMix-KH-Fold-Experience-v8-Hotfix.patch
      - MelonMix-KH-Touch-Polish-v9.patch
      - MelonMix-KH-Final-Polish-v10.patch
      - MelonMix-KH-Control-Zones-v11.patch
      - MelonMix-KH-Control-Zones-v11-Hotfix.patch
      - MelonMix-KH-Universal-Controls-v12.patch
      - MelonMix-KH-Default-and-Scene-Controls-v13.patch
      - MelonMix-KH-Editable-Preset-and-Scene-Fades-v14.patch
      - MelonMix-KH-Adaptive-Backgrounds-and-Portrait-v15.patch
      - MelonMix-KH-Adaptive-Backgrounds-v15-Hotfix.patch
      - MelonMix-KH-Portrait-Viewport-Bias-v16.patch
      - MelonMix-KH-Adjustable-Portrait-Position-v17.patch
      - MelonMix-KH-Layout-Backup-v18.patch
      - MelonMix-KH-Flex-Mode-v19.patch
      - MelonMix-KH-Flex-Map-and-Live-Viewport-v20.patch
      - MelonMix-KH-Flex-Viewport-Fix-v21.patch
      - MelonMix-KH-Live-Projection-and-Flex-Video-v22.patch
      - MelonMix-KH-Flex-Geometry-and-Projection-v23.patch
      - MelonMix-KH-Projection-Bootstrap-Hotfix-v24.patch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Collect the full source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: zulu
          cache: gradle

      - name: Restore permanent KHDS signing identity
        env:
          KHDS_KEYSTORE_BASE64: ${{ secrets.KHDS_KEYSTORE_BASE64 }}
          KHDS_KEYSTORE_PASSWORD: ${{ secrets.KHDS_KEYSTORE_PASSWORD }}
          KHDS_KEY_ALIAS: ${{ secrets.KHDS_KEY_ALIAS }}
          KHDS_KEY_PASSWORD: ${{ secrets.KHDS_KEY_PASSWORD }}
        run: |
          test -n "$KHDS_KEYSTORE_BASE64" || { echo "Missing KHDS_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KHDS_KEYSTORE_PASSWORD" || { echo "Missing KHDS_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KHDS_KEY_ALIAS" || { echo "Missing KHDS_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KHDS_KEY_PASSWORD" || { echo "Missing KHDS_KEY_PASSWORD repository secret"; exit 1; }
          printf '%s' "$KHDS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/khds-touch-remix.jks"
          {
            echo "MELONDS_KEYSTORE=$RUNNER_TEMP/khds-touch-remix.jks"
            echo "MELONDS_KEYSTORE_PASSWORD=$KHDS_KEYSTORE_PASSWORD"
            echo "MELONDS_KEY_ALIAS=$KHDS_KEY_ALIAS"
            echo "MELONDS_KEY_PASSWORD=$KHDS_KEY_PASSWORD"
          } >> local.properties

      - name: Add Lock On
        run: git apply MelonMix-KH-Lock-On-touch-v1.patch
      - name: Add camera stick
        run: git apply MelonMix-KH-Camera-Stick-v2.patch
      - name: Add relative precision camera
        run: git apply MelonMix-KH-Relative-Camera-v3.patch
      - name: Add shortcut toggle
        run: git apply MelonMix-KH-Shortcut-Toggle-v4.patch
      - name: Add movement stick command pad and heart icon
        run: git apply MelonMix-KH-Movement-and-Heart-v5.patch
      - name: Add layout editor grid snapping
        run: git apply MelonMix-Layout-Grid-Snap-v6.patch
      - name: Add dedicated KH action buttons
        run: git apply MelonMix-KH-Action-Buttons-v7.patch
      - name: Add the Fold viewport and touch experience
        run: git apply MelonMix-KH-Fold-Experience-v8.patch
      - name: Apply the Fold Kotlin import hotfix
        run: git apply MelonMix-KH-Fold-Experience-v8-Hotfix.patch
      - name: Add touch polish and relative camera zone
        run: git apply MelonMix-KH-Touch-Polish-v9.patch
      - name: Add summoned movement stick and label spacing
        run: git apply MelonMix-KH-Final-Polish-v10.patch
      - name: Add independent control zones opacity and hide toggle
        run: git apply MelonMix-KH-Control-Zones-v11.patch
      - name: Fix per-control opacity compilation
        run: git apply MelonMix-KH-Control-Zones-v11-Hotfix.patch
      - name: Add universal KH labels and reliable zone layering
        run: git apply MelonMix-KH-Universal-Controls-v12.patch
      - name: Add the KH default preset and scene-aware controls
        run: |
          # Apply the Android/UI portion normally. The 1.0.2 release changed nearby
          # native lines and the plugin core is a submodule, so those tiny additions
          # are inserted below using stable declarations instead of line numbers.
          git apply \
            --exclude=app/src/main/cpp/MelonInstance.cpp \
            --exclude=app/src/main/cpp/MelonInstance.h \
            --exclude=melonDS-android-lib/src/plugins/Plugin.h \
            --exclude=melonDS-android-lib/src/plugins/PluginKingdomHeartsDays.h \
            --exclude=melonDS-android-lib/src/plugins/PluginKingdomHeartsReCoded.h \
            MelonMix-KH-Default-and-Scene-Controls-v13.patch

          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path, anchor, addition):
              file = Path(path)
              text = file.read_text()
              if addition.strip() in text:
                  return
              if anchor not in text:
                  raise SystemExit(f"Scene-control anchor missing in {path}: {anchor!r}")
              file.write_text(text.replace(anchor, anchor + addition, 1))

          insert_after(
              "app/src/main/cpp/MelonInstance.cpp",
              "        plugin->buildShapes();\n",
              "\n        const bool hideSceneControls = plugin->shouldHideNonessentialTouchControls();\n"
              "        if (hideSceneControls != khSceneControlsHidden)\n"
              "        {\n"
              "            khSceneControlsHidden = hideSceneControls;\n"
              "            int32_t hidden = hideSceneControls ? 1 : 0;\n"
              "            fireEmulatorEvent(AndroidMelonEventMessenger::EVENT_KH_SCENE_CONTROLS, sizeof(hidden), &hidden);\n"
              "        }\n",
          )
          insert_after(
              "app/src/main/cpp/MelonInstance.h",
              "    bool khPauseMenuShown = false;\n",
              "    bool khSceneControlsHidden = false;\n",
          )
          insert_after(
              "melonDS-android-lib/src/plugins/Plugin.h",
              "    virtual bool isCutsceneGameScene() {return false;};\n",
              "    virtual bool shouldHideNonessentialTouchControls() { return isCutsceneGameScene(); }\n",
          )
          insert_after(
              "melonDS-android-lib/src/plugins/PluginKingdomHeartsDays.h",
              "    bool isCutsceneGameScene() override;\n",
              "    bool shouldHideNonessentialTouchControls() override { return isCutsceneGameScene() || isDialogVisible(); }\n",
          )
          insert_after(
              "melonDS-android-lib/src/plugins/PluginKingdomHeartsReCoded.h",
              "    bool isCutsceneGameScene() override;\n",
              "    bool shouldHideNonessentialTouchControls() override { return isCutsceneGameScene() || isDialogVisible(); }\n",
          )
          PY

      - name: Add the editable KHDS preset and refined scene fades
        run: |
          git apply \
            --exclude=app/src/main/cpp/MelonInstance.cpp \
            --exclude=app/src/main/cpp/MelonInstance.h \
            --exclude=melonDS-android-lib/src/plugins/Plugin.h \
            --exclude=melonDS-android-lib/src/plugins/PluginKingdomHeartsDays.cpp \
            --exclude=melonDS-android-lib/src/plugins/PluginKingdomHeartsDays.h \
            --exclude=melonDS-android-lib/src/plugins/PluginKingdomHeartsReCoded.cpp \
            --exclude=melonDS-android-lib/src/plugins/PluginKingdomHeartsReCoded.h \
            MelonMix-KH-Editable-Preset-and-Scene-Fades-v14.patch

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"v19 anchor missing in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "app/src/main/cpp/MelonInstance.h",
              "    bool khSceneControlsHidden = false;",
              "    int khTouchControlSceneMode = 0;",
          )
          replace_once(
              "app/src/main/cpp/MelonInstance.cpp",
              "        const bool hideSceneControls = plugin->shouldHideNonessentialTouchControls();\n"
              "        if (hideSceneControls != khSceneControlsHidden)\n"
              "        {\n"
              "            khSceneControlsHidden = hideSceneControls;\n"
              "            int32_t hidden = hideSceneControls ? 1 : 0;\n"
              "            fireEmulatorEvent(AndroidMelonEventMessenger::EVENT_KH_SCENE_CONTROLS, sizeof(hidden), &hidden);\n"
              "        }",
              "        const int touchControlSceneMode = plugin->touchControlSceneMode();\n"
              "        if (touchControlSceneMode != khTouchControlSceneMode)\n"
              "        {\n"
              "            khTouchControlSceneMode = touchControlSceneMode;\n"
              "            int32_t mode = touchControlSceneMode;\n"
              "            fireEmulatorEvent(AndroidMelonEventMessenger::EVENT_KH_SCENE_CONTROLS, sizeof(mode), &mode);\n"
              "        }",
          )
          replace_once(
              "melonDS-android-lib/src/plugins/Plugin.h",
              "    virtual bool shouldHideNonessentialTouchControls() { return isCutsceneGameScene(); }",
              "    virtual bool shouldHideNonessentialTouchControls() { return isCutsceneGameScene(); }\n"
              "    virtual int touchControlSceneMode() { return shouldHideNonessentialTouchControls() ? 2 : 0; }",
          )
          replace_once(
              "melonDS-android-lib/src/plugins/PluginKingdomHeartsDays.h",
              "    bool shouldHideNonessentialTouchControls() override { return isCutsceneGameScene() || isDialogVisible(); }",
              "    int touchControlSceneMode() override;",
          )
          replace_once(
              "melonDS-android-lib/src/plugins/PluginKingdomHeartsReCoded.h",
              "    bool shouldHideNonessentialTouchControls() override { return isCutsceneGameScene() || isDialogVisible(); }",
              "    int touchControlSceneMode() override;",
          )
          replace_once(
              "melonDS-android-lib/src/plugins/PluginKingdomHeartsDays.cpp",
              "    gameScene_Other\n};",
              "    gameScene_Other\n};\n\n"
              "int PluginKingdomHeartsDays::touchControlSceneMode()\n"
              "{\n"
              "    if (GameScene == gameScene_InGameWithMap && isCharacterControllable && !isDialogVisible()) return 0;\n"
              "    if (GameScene == gameScene_InGameMenu || GameScene == gameScene_ConfigMenu) return 1;\n"
              "    return 2;\n"
              "}",
          )
          replace_once(
              "melonDS-android-lib/src/plugins/PluginKingdomHeartsReCoded.cpp",
              "    gameScene_Other                     // 19\n};",
              "    gameScene_Other                     // 19\n};\n\n"
              "int PluginKingdomHeartsReCoded::touchControlSceneMode()\n"
              "{\n"
              "    const bool gameplay = GameScene == gameScene_InGameWithMap || GameScene == gameScene_InGameOlympusBattle;\n"
              "    if (gameplay && !isDialogVisible() && !isCutsceneGameScene()) return 0;\n"
              "    if (GameScene == gameScene_InGameMenu) return 1;\n"
              "    return 2;\n"
              "}",
          )
          PY

      - name: Add adaptive backgrounds and the portrait 4-by-3 viewport
        run: git apply MelonMix-KH-Adaptive-Backgrounds-and-Portrait-v15.patch

      - name: Fix bundled background package lookup
        run: git apply MelonMix-KH-Adaptive-Backgrounds-v15-Hotfix.patch

      - name: Bias portrait game view upward within safe insets
        run: git apply MelonMix-KH-Portrait-Viewport-Bias-v16.patch

      - name: Add adjustable portrait screen positioning
        run: git apply MelonMix-KH-Adjustable-Portrait-Position-v17.patch

      - name: Reveal internal layout backup and restore
        run: git apply MelonMix-KH-Layout-Backup-v18.patch

      - name: Add full-panel hinge-aware tabletop flex mode
        run: git apply MelonMix-KH-Flex-Mode-v19.patch

      - name: Add flex cutscene map and live viewport fixes
        run: git apply MelonMix-KH-Flex-Map-and-Live-Viewport-v20.patch

      - name: Fix Flex video panel and live aspect refresh
        run: git apply MelonMix-KH-Flex-Viewport-Fix-v21.patch

      - name: Bind Flex video and refresh the native KH projection
        run: git apply MelonMix-KH-Live-Projection-and-Flex-Video-v22.patch

      - name: Fix Flex geometry detection and projection bootstrap
        run: git apply MelonMix-KH-Flex-Geometry-and-Projection-v23.patch

      - name: Prevent provisional projection writes from blanking KH graphics
        run: git apply MelonMix-KH-Projection-Bootstrap-Hotfix-v24.patch

      - name: Target the established adaptive Touch Remix installation
        run: |
          sed -i 's/applicationIdSuffix = ".dev"/applicationIdSuffix = ".adaptivekh"/' app/build.gradle.kts
          sed -i 's/versionCode = AppConfig.versionCode/versionCode = AppConfig.versionCode + 1006/' app/build.gradle.kts
          sed -i '/getByName("debug") {/a\            signingConfig = signingConfigs.getByName("release")' app/build.gradle.kts

      - name: Bake the adaptive KHDS Touch Remix APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGitHubProdDebug --stacktrace

      - name: Package the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: KHDS-Touch-Remix-1.0.6-Projection-Safety-Hotfix
          path: app/build/outputs/apk/gitHubProd/debug/*.apk
          if-no-files-found: error
          retention-days: 7
