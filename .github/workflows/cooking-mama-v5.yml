name: Cooking Mama v5 - Build Camera Stick APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cooking-mama-v5.yml
      - MelonMix-KH-Lock-On-touch-v1.patch
      - MelonMix-KH-Camera-Stick-v2.patch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Collect the full source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: zulu
          cache: gradle

      - name: Add the KH Lock On touchscreen button
        run: git apply MelonMix-KH-Lock-On-touch-v1.patch

      - name: Add the KH camera touchscreen stick
        run: git apply MelonMix-KH-Camera-Stick-v2.patch

      - name: Give the camera test its own app identity
        run: sed -i 's/applicationIdSuffix = ".dev"/applicationIdSuffix = ".camera"/' app/build.gradle.kts

      - name: Bake the camera-stick debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGitHubProdDebug --stacktrace

      - name: Package the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MelonMix-KH-Touch-v2-Camera-Stick
          path: app/build/outputs/apk/gitHubProd/debug/*.apk
          if-no-files-found: error
          retention-days: 7
